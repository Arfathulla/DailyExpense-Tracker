spring.application.name=expense-tracker
server.port=${PORT:8080}

# Default = in-memory H2 (zero setup). For MySQL set DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:mem:expensedb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.flyway.enabled=true
# Existing databases created by the old ddl-auto=update are adopted as V1 instead of failing; empty ones run V1.
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-before-deploying}
app.jwt.expiration-ms=86400000
app.seed-demo=${SEED_DEMO:true}

# ---- Email (monthly summary). Off by default: summaries are only logged until app.mail.enabled=true ----
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:SpendLedger <no-reply@spendledger.local>}
app.mail.currency-symbol=${MAIL_CURRENCY:₹}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
